# azure-pipelines.yml - tcpkv on Azure DevOps. Mirrors .github/workflows/ci.yml.
#
# Stage Build:    gcc/clang x Debug/RelWithDebInfo matrix, -Werror, ctest -> JUnit, ccache; asan/tsan; valgrind
# Stage Package:  Docker build and push to a container registry (skipped for pull requests)
#
# Set up: Pipelines -> New pipeline -> GitHub repo -> Existing Azure Pipelines YAML file.
# The Docker task needs a Service Connection named 'acr-service-connection' (Project Settings ->
# Service connections -> Docker Registry). Without it, the Package stage is skipped by condition.

trigger:
  branches:
    include: [main]
  tags:
    include: ['v*']

pr:
  branches:
    include: [main]

variables:
  CMAKE_GENERATOR: Ninja
  CCACHE_DIR: $(Pipeline.Workspace)/ccache
  # Set this pipeline variable to 'true' in the UI once the service connection exists.
  PUSH_IMAGE: 'false'

stages:
# ============================================================================ Build
- stage: Build
  displayName: Build and test
  jobs:

  - job: BuildTest
    displayName: Build + test
    pool:
      vmImage: 'ubuntu-24.04'
    strategy:
      matrix:
        gcc_debug:
          CC: gcc-13
          CXX: g++-13
          BUILD_TYPE: Debug
        gcc_release:
          CC: gcc-13
          CXX: g++-13
          BUILD_TYPE: RelWithDebInfo
        clang_debug:
          CC: clang-18
          CXX: clang++-18
          BUILD_TYPE: Debug
        clang_release:
          CC: clang-18
          CXX: clang++-18
          BUILD_TYPE: RelWithDebInfo
    steps:
    - checkout: self
      fetchDepth: 1

    - script: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ninja-build ccache $(CC) $(CXX)
        $(CXX) --version
        cmake --version
      displayName: Install toolchain

    - task: Cache@2
      displayName: Cache ccache
      inputs:
        key: 'ccache | "$(Agent.OS)" | $(CC) | $(BUILD_TYPE) | CMakeLists.txt | CMakePresets.json | tests/CMakeLists.txt'
        restoreKeys: |
          ccache | "$(Agent.OS)" | $(CC) | $(BUILD_TYPE)
        path: $(CCACHE_DIR)

    - script: >
        cmake -S . -B build/ci -G Ninja
        -DCMAKE_BUILD_TYPE=$(BUILD_TYPE)
        -DCMAKE_C_COMPILER=$(CC)
        -DCMAKE_CXX_COMPILER=$(CXX)
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DTCPKV_WERROR=ON
        -DTCPKV_BUILD_TESTS=ON
      displayName: Configure

    - script: cmake --build build/ci --parallel && ccache --show-stats
      displayName: Build

    - script: >
        ctest --test-dir build/ci --output-on-failure --parallel 4
        --output-junit $(Build.ArtifactStagingDirectory)/junit.xml
      displayName: Test

    - task: PublishTestResults@2
      displayName: Publish test results
      condition: always()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: '$(Build.ArtifactStagingDirectory)/junit.xml'
        testRunTitle: '$(CC) $(BUILD_TYPE)'
        failTaskOnFailedTests: true

    - task: PublishPipelineArtifact@1
      displayName: Publish unstripped release binary
      condition: and(succeeded(), eq(variables['CC'], 'gcc-13'), eq(variables['BUILD_TYPE'], 'RelWithDebInfo'))
      inputs:
        targetPath: build/ci/tcpkv
        artifact: tcpkv-linux-x86_64-unstripped

  - job: Sanitizers
    displayName: Sanitizers
    pool:
      vmImage: 'ubuntu-24.04'
    strategy:
      matrix:
        asan:
          PRESET: asan
        tsan:
          PRESET: tsan
    steps:
    - checkout: self
      fetchDepth: 1
    - script: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      displayName: Install ninja
    - script: cmake --preset $(PRESET)
      displayName: Configure $(PRESET)
    - script: cmake --build --preset $(PRESET)
      displayName: Build $(PRESET)
    - script: ctest --preset $(PRESET)
      displayName: Test $(PRESET)

  - job: Valgrind
    displayName: Valgrind memcheck
    pool:
      vmImage: 'ubuntu-24.04'
    steps:
    - checkout: self
      fetchDepth: 1
    - script: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build valgrind
      displayName: Install tools
    - script: cmake --preset debug && cmake --build --preset debug
      displayName: Configure and build
    - script: >
        valgrind --error-exitcode=1 --leak-check=full --show-leak-kinds=definite --track-origins=yes
        ./build/debug/tests/tcpkv_tests --gtest_filter='-*Concurrency*'
      displayName: memcheck

  - job: Format
    displayName: clang-format
    pool:
      vmImage: 'ubuntu-24.04'
    steps:
    - checkout: self
      fetchDepth: 1
    - script: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format-18
      displayName: Install clang-format
    - script: |
        find src include tests -name '*.cpp' -o -name '*.hpp' | xargs clang-format-18 --dry-run --Werror --style=file
      displayName: Check formatting

# ============================================================================ Package
- stage: Package
  displayName: Docker image
  dependsOn: Build
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - job: Docker
    displayName: Build and push image
    pool:
      vmImage: 'ubuntu-24.04'
    steps:
    - checkout: self
      fetchDepth: 1

    - task: Docker@2
      displayName: Build image
      inputs:
        command: build
        Dockerfile: Dockerfile
        buildContext: .
        repository: tcpkv
        tags: |
          $(Build.SourceVersion)
          $(Build.SourceBranchName)

    - script: |
        set -euo pipefail
        docker run -d --name smoke -p 7000:7000 tcpkv:$(Build.SourceVersion)
        for i in $(seq 1 20); do
          if printf 'PING\n' | nc -w 1 127.0.0.1 7000 | grep -q PONG; then echo "PONG received"; break; fi
          sleep 0.5
          if [ "$i" = 20 ]; then echo "server never answered"; docker logs smoke; exit 1; fi
        done
        docker stop smoke
      displayName: Smoke test the image

    - task: Docker@2
      displayName: Push image
      condition: and(succeeded(), eq(variables['PUSH_IMAGE'], 'true'))
      inputs:
        command: push
        containerRegistry: 'acr-service-connection'
        repository: tcpkv
        tags: |
          $(Build.SourceVersion)
          $(Build.SourceBranchName)
