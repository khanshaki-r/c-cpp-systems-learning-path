# GENERATED by site_tools/build_config.py - edit that file, not this one.
site_name: C, C++ Systems Engineering Learning Path
site_description: A 12-week, production-depth curriculum in C, modern C++, concurrency, debugging, Linux, databases and distributed systems.
site_author: MD Shakir Khan
site_url: https://khanshaki-r.github.io/c-cpp-systems-learning-path/
repo_url: https://github.com/khanshaki-r/c-cpp-systems-learning-path
repo_name: khanshaki-r/c-cpp-systems-learning-path
edit_uri: edit/main/LEARNING_PATH/
docs_dir: LEARNING_PATH
use_directory_urls: true

exclude_docs: |
  _STYLE_GUIDE.md
  **/code/**
  **/reference_code/**
  11_Interview_Prep_Job_Search/

theme:
  name: material
  language: en
  icon:
    logo: material/chip
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - assets/extra.css
extra_javascript:
  - assets/progress.js

hooks:
  - site_tools/hooks.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - mdx_truly_sane_lists:
      nested_indent: 2
  - mdx_breakless_lists
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  github_blob: https://github.com/khanshaki-r/c-cpp-systems-learning-path/blob/main/LEARNING_PATH/
  github_tree: https://github.com/khanshaki-r/c-cpp-systems-learning-path/tree/main/LEARNING_PATH/
